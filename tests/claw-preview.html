<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인형뽑기 그래픽 검증</title><style>body{font-family:sans-serif;background:#edf8f6;margin:20px}canvas{width:min(800px,100%);display:block}button{padding:15px;margin:8px}</style><h1>인형뽑기 그래픽 검증</h1><canvas aria-label="집게 게임 미리보기"></canvas><button id="aim">첫 인형 조준</button><button id="drop">DROP</button><output></output><script src="../js/games/claw/catalog.js"></script><script src="../js/games/claw/engine.js"></script><script src="../js/games/claw/renderer.js"></script><script>document.querySelector('base')?.remove();</script><script>
// Renderer uses site-root-relative assets; fixture sets the base before loading art.
const base=document.createElement('base');base.href='../';document.head.append(base);
(async()=>{const e=new SianClaw.Engine(),r=new SianClaw.Renderer(document.querySelector('canvas'),await SianClaw.loadArt());document.querySelector('#aim').onclick=()=>e.aim(e.toys[0].x,e.toys[0].z);document.querySelector('#drop').onclick=()=>e.phase==='result'?e.resetRound():e.drop();let last=0;function loop(t){const dt=last?Math.min(.025,(t-last)/1000):0;last=t;e.step(dt);r.paint(e);document.querySelector('output').textContent=e.phase+' '+(e.result?.success?'success':'');requestAnimationFrame(loop);}requestAnimationFrame(loop);})();
</script></html>
