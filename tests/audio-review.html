<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시안Hi 오디오 검증</title><link rel="stylesheet" href="../css/audio.css"><style>body{font:16px sans-serif;background:#eff9fc;color:#254357;margin:18px}button,select{min-height:44px;margin:4px;padding:8px;border:1px solid #bdd7e0;border-radius:12px;background:white}fieldset{border:1px solid #cee0e5;border-radius:16px;margin:12px 0}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;font:13px monospace}.learningAudioStatus{min-height:24px}</style></head><body><h1>운영 오디오 검증</h1><p>실제 운영 악보·믹서 사용. 사용자 저장 데이터에 쓰지 않는 검증 화면입니다. 신호 측정과 실제 청취는 별도로 확인합니다.</p><div id="gameBody"></div><fieldset><legend>곡 선택</legend><select aria-label="음악"></select><button id="play">음악 시작</button><button id="pause">잠깐 멈춤</button><button id="resume">계속</button><button id="stop">종료</button></fieldset><fieldset><legend>상황 전환</legend><button data-event="bossTransition">보스 이동</button><button data-event="bossArena">보스 등장</button><button data-event="bossDefeat">보스 승리</button><button data-event="death">사망</button><button data-event="respawn">재시작</button></fieldset><fieldset><legend>효과음</legend><div id="effects"></div></fieldset><fieldset><legend>학습 음성</legend><button id="ko">한국어 듣기</button><button id="en">Apple 듣기</button><button id="duck">음성 우선순위 믹스 시험</button><button id="unduck">음악 복원 시험</button><p class="learningAudioStatus" role="status"></p></fieldset><output aria-label="오디오 측정"></output><script>const state={sound:true,stars:0},save=()=>{};</script><script src="../js/audio/scores.js"></script><script src="../js/audio/engine.js"></script><script src="../js/audio/voice-director.js"></script><script src="../assets/audio/voice-manifest.js"></script><script src="../js/curriculum/speech.js"></script><script>
const select=document.querySelector('select'),out=document.querySelector('output'),status=document.querySelector('[role=status]');select.innerHTML=Object.values(SianScores.tracks).map(t=>'<option value="'+t.id+'">'+t.id+' · '+t.title+'</option>').join('');document.getElementById('play').onclick=()=>SianAudio.start(select.value);document.getElementById('pause').onclick=()=>SianAudio.pause(true);document.getElementById('resume').onclick=()=>{SianAudio.pause(false);SianAudio.unlock();};document.getElementById('stop').onclick=()=>{LearningSpeech.stop();SianAudio.stop();};document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>SianAudio.event({type:b.dataset.event,reason:'fall'},Math.max(1,SianScores.worlds.indexOf(select.value)+1)));document.getElementById('effects').innerHTML=['jump','land','coin','star','letter','wordComplete','growth','starPower','starShot','enemyStarHit','blockHit','blockBreak','clawDrop','clear','worldClear'].map(x=>'<button data-effect="'+x+'">'+x+'</button>').join('');document.querySelectorAll('[data-effect]').forEach(b=>b.onclick=()=>SianAudio.effect(b.dataset.effect));document.getElementById('ko').onclick=e=>LearningSpeech.speak([{text:'그림을 잘 봐. 어떤 친구가 똑같이 생겼을까?',lang:'ko-KR'}],{button:e.currentTarget,status});document.getElementById('en').onclick=e=>LearningSpeech.speak([{text:'Apple',lang:'en-US'}],{button:e.currentTarget,status});document.getElementById('duck').onclick=()=>SianAudio.duck(true);document.getElementById('unduck').onclick=()=>SianAudio.duck(false);setInterval(()=>{out.textContent=JSON.stringify(Object.fromEntries(Object.entries(document.documentElement.dataset).filter(([k])=>k.startsWith('audio'))),null,2);},250);
</script></body></html>
