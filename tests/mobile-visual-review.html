<!doctype html><html lang="ko"><meta charset="utf-8"><title>게임 모바일 시각 검증</title><style>body{font:14px sans-serif;background:#e8edf3}button{padding:12px;margin:5px}iframe{display:block;width:390px;height:844px;border:1px solid #7593a5}</style><h1>운영 코드 모바일 검증</h1><p>현재 운영 HTML과 동일한 파일을 320 / 390 / 430px 프레임에서 실행합니다.</p><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="430">430px</button><iframe title="모바일 게임 검증"></iframe><script>
const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');
fetch('../index.html').then(r=>r.text()).then(html=>{frame.srcdoc=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">');});
</script></html>
