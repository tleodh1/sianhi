<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입체 학습 운영 코드 검증</title><style>body{font:14px sans-serif;background:#eaf2f5}button,select{min-height:42px;margin:4px}iframe{display:block;width:390px;height:844px;border:1px solid #98b0bd;margin-top:12px}label{display:inline-block}output{display:block;font-size:12px;padding:5px}</style></head><body><h1>입체 학습 운영 코드 검증</h1><p>실제 운영 모듈 · 검증용 임시 저장소 · 기존 사용자 진도에 쓰지 않습니다.</p><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="430">430px</button><label>미션 <select id="case"><option value="수학:1">과일 비교</option><option value="사고력 수학:1">색 분류</option><option value="사고력 수학:5">두 속성 표</option><option value="사고력 수학:42">벤다이어그램</option><option value="사고력 수학:43">분류 나무</option><option value="사고력 수학:12">징검다리</option><option value="사고력 수학:91">전략 보드</option><option value="사고력 수학:31">회전</option><option value="사고력 수학:32">거울</option><option value="수학:72">분수</option><option value="수학:41">시계</option><option value="수학:51">동전</option><option value="한자:1">一 처음 쓰기</option><option value="한자:7">山 처음 쓰기</option><option value="한자:15">木 처음 쓰기</option><option value="한자:95">川 기억 쓰기</option></select></label><button id="open">미션 열기</button><output id="metrics">준비 중</output><iframe title="학습 모바일 검증"></iframe><script>
const frame=document.querySelector('iframe'),select=document.querySelector('select');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');document.getElementById('open').onclick=()=>frame.contentWindow.postMessage({type:'learning-review',subject:select.value.split(':')[0],stage:Number(select.value.split(':')[1])},location.origin);
fetch('learning-space-frame.html').then(r=>r.text()).then(html=>{frame.srcdoc=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">');});window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='learning-metrics')document.getElementById('metrics').textContent=e.data.text;});
</script></body></html>
