<!doctype html><html lang="ko"><meta charset="utf-8"><title>시안팡 모바일 검증</title><style>body{font:14px sans-serif;background:#dfeaf3;margin:8px}button{padding:10px;margin:3px}iframe{display:block;width:390px;height:844px;border:1px solid #7493af}#report{white-space:pre-wrap}</style><h1>시안팡 운영 화면 검증</h1><button data-size="320,568">320 × 568</button><button data-size="390,844">390 × 844</button><button data-size="430,932">430 × 932</button><button id="measure">화면 측정</button><iframe title="시안팡 운영 화면"></iframe><pre id="report"></pre><script>
const frame=document.querySelector('iframe');document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px';});document.querySelector('#measure').onclick=()=>{const d=frame.contentDocument,m=d.querySelector('#game'),c=d.querySelector('.pangWrap canvas'),b=d.querySelector('.pangWrap'),r=c?.getBoundingClientRect(),br=b?.getBoundingClientRect();document.querySelector('#report').textContent=JSON.stringify({width:frame.clientWidth,height:frame.clientHeight,modal:{width:m.clientWidth,scrollWidth:m.scrollWidth,height:m.clientHeight,scrollHeight:m.scrollHeight},canvas:r?.toJSON(),boardInner:{width:b?.clientWidth,height:b?.clientHeight},boardFits:!!r&&Math.abs(r.width-r.height)<1&&Math.abs(r.width-b.clientWidth)<1&&Math.abs(r.height-b.clientHeight)<1&&Math.abs(r.bottom-(br.bottom-b.clientTop))<1,bodyOverflow:d.body.style.overflow,phase:c?.dataset.phase,score:c?.dataset.score},null,2);};fetch('../index.html').then(r=>r.text()).then(html=>{frame.onload=()=>frame.contentDocument.querySelector('[data-game="pang"]').click();frame.srcdoc=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">');});
</script></html>
