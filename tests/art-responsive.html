<!doctype html><html lang="ko"><meta charset="utf-8"><title>명화 퍼즐 반응형 검증</title><style>body{font-family:sans-serif;background:#eee}iframe{display:block;border:1px solid #aaa;width:390px;height:844px}button{padding:12px;margin:8px}</style><h1>명화 퍼즐 반응형 검증</h1><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="430">430px</button><iframe title="시안Hi 반응형 화면" src="../index.html"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');</script></html>
