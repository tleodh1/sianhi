<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#8cd5f9" />
    <meta
      name="description"
      content="시안이의 배움이 모험이 되는 곳. 연산, 수학, 사고력, 한글, 영어, 과학, 코딩, 한자를 게임으로 만나요."
    />
    <title>시안Hi · 매일 새로운 모험</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <a class="skip" href="#main">본문으로 이동</a>
    <header class="siteHeader">
      <a href="#home" class="brand">시안<span>Hi</span><i>✦</i></a>
      <nav aria-label="주 메뉴">
        <button data-nav="home" class="active">모험의 시작</button
        ><button data-nav="games">게임 월드</button
        ><button data-nav="learning">학습 지도</button
        ><button data-nav="records">나의 기록</button
        ><button data-nav="collection">수집함</button>
      </nav>
      <div class="profileArea">
        <button id="soundToggle" aria-label="소리 켜기">♪</button
        ><button id="profileButton" aria-label="시안이 프로필">
          <span class="face"
            ><img src="assets/sian-face.webp" alt="시안이 얼굴" /></span
          ><span
            ><b>시안 탐험가</b><small id="level">LEVEL 1</small></span
          ></button
        ><span class="stars">★ <b id="stars">0</b></span>
      </div>
    </header>
    <main id="main"></main>
    <footer class="siteFooter">
      <a class="brand" href="#home">시안<span>Hi</span><i>✦</i></a>
      <p>작은 발견, 커다란 모험. 오늘도 시안이의 속도로.</p>
      <button id="parentButton">보호자 안내</button>
    </footer>
    <dialog id="game" aria-label="시안Hi 게임">
      <button class="close" aria-label="게임 닫기">×</button>
      <div id="gameBody"></div>
    </dialog>
    <div id="notice" role="status" hidden></div>
    <noscript
      ><p>게임을 하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript
    >
    <script src="js/core.js"></script>
    <script src="js/games.js"></script>
    <script src="js/learning.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
